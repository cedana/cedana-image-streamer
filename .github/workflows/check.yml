name: Check

on:
  workflow_call:
    inputs:
      rust:
        type: boolean
        description: "Run Rust checks"
        required: false
        default: false

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: runs-on=${{github.run_id}}/runner=4cpu-amd64
    if: inputs.rust
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings
