name: Release

permissions:
  actions: write
  contents: write
  packages: write
  id-token: write
  pull-requests: write
  checks: write

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      debug_build:
        type: boolean
        description: "Run build with debugging enabled"
        required: false
        default: false
      debug_test:
        type: boolean
        description: "Run tests with debugging enabled"
        required: false
        default: false
      debug_publish:
        type: boolean
        description: "Run publish with debugging enabled"
        required: false
        default: false

concurrency:
  group: cedana-image-streamer-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The release workflow trumps the push workflow: cancel any push run for this
  # commit so that only the release runs.
  cancel_push:
    name: Cancel push
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel push runs for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow push.yml --commit "$GITHUB_SHA" \
            --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' |
            xargs -r -n1 gh run cancel --repo "$GITHUB_REPOSITORY"

  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_build }}

  download:
    name: Download
    uses: cedana/cedana/.github/workflows/download.yml@main
    secrets: inherit
    with:
      cedana_version: main
      criu_version: criu-dev
      gpu_version: main

  test:
    name: Test
    uses: cedana/cedana/.github/workflows/test_streamer.yml@main
    needs: [build, download]
    secrets: inherit
    with:
      ref: main
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_test }}
      post_summary: true

  test_unit:
    name: Test (Unit)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v2
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - run: make test

  publish:
    name: Publish
    uses: ./.github/workflows/publish.yml
    needs: test
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_publish }}
      github: true
      propagator: true
      propagator_repo: cedana-image-streamer
      post_summary: true
