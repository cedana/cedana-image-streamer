name: Build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: "The branch, tag, or SHA to run on"
        required: false
        default: ""
      debug:
        type: boolean
        description: Run with debugging enabled
        required: false
        default: false

jobs:
  streamer:
    name: Streamer
    # The release build took 60-100s on 1 CPU, with no cache
    runs-on: runs-on=${{github.run_id}}/runner=4cpu-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt -y install protobuf-compiler
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build cedana-image-streamer
        run: |
          make

      - name: Upload binary
        id: upload-binary
        uses: actions/upload-artifact@v4
        with:
          name: streamer-${{ matrix.arch }}
          path: target/release/cedana-image-streamer
