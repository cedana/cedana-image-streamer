name: Publish

env:
  CEDANA_URL: ${{ vars.CEDANA_URL }}

on:
  workflow_call:
    inputs:
      debug:
        type: boolean
        description: "Run with debugging enabled"
        required: false
        default: false
      github:
        type: boolean
        description: "Publish to GitHub"
        required: false
        default: false
      propagator:
        type: boolean
        description: "Publish to propagator"
        required: false
        default: false
      propagator_repo:
        type: string
        description: "Propagator repository to publish to"
        required: false
        default: cedana-image-streamer
      post_summary:
        type: boolean
        description: "Post summary to Slack"
        required: false
        default: false

jobs:
  github:
    name: GitHub
    if: inputs.github
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
      max-parallel: 1 # DO NOT CHANGE: required to run in order
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        id: download-binaries
        with:
          name: streamer-amd64

      - name: Setup debugging session
        uses: mxschmitt/action-tmate@v3
        if: inputs.debug
        with:
          limit-access-to-actor: true

      - name: Create tarballs
        run: |
          tar -czf cedana-image-streamer-${{ matrix.arch }}.tar.gz cedana-image-streamer

      - name: Create release
        if: matrix.arch == 'amd64'
        id: create-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.head_ref || github.ref_name }}
        run: |
          gh release create "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              --title="$tag" \
              --generate-notes

      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.head_ref || github.ref_name }}
        run: |
          gh release upload --clobber "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              *.tar.gz \

  propagator:
    name: propagator-${{ matrix.arch }}
    if: inputs.propagator
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - uses: runs-on/action@v1
      - name: Download binaries
        uses: actions/download-artifact@v4
        id: download-binaries
        with:
          name: streamer-${{ matrix.arch }}

      - name: Upload to Propagator
        env:
          CEDANA_AUTH_TOKEN: ${{ secrets.CEDANA_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          REF="${{ github.head_ref || github.ref_name }}"
          ARCH="${{ matrix.arch }}"

          REPOSITORY="${{ inputs.propagator_repo }}"
          BUILD=""
          if [[ "$REPOSITORY" == "cedana-image-streamer-alpha" ]]; then
            BUILD="alpha"
            REPOSITORY="cedana-image-streamer"
          fi

          FILE="cedana-image-streamer"

          CHECKSUM="$(python3 -c 'import sys, zlib, base64, struct; print(base64.b64encode(struct.pack(">I", zlib.crc32(open(sys.argv[1], "rb").read()) & 0xffffffff)).decode())' "$FILE")"

          echo "Querying propagator for ${FILE} ..."
          RESPONSE="$(
            curl -sS --fail -X POST \
              "${CEDANA_URL}/plugins/upload/${FILE}" \
              -H "Authorization: Bearer $CEDANA_AUTH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"repository\":\"${REPOSITORY}\",\"version\":\"${REF}\",\"arch\":\"${ARCH}\",\"build\":\"${BUILD}\",\"checksum\":\"${CHECKSUM}\"}"
          )"

          VERSION_UPLOAD_URL="$(echo "$RESPONSE" | jq -r '.version_upload_url')"
          LATEST_UPLOAD_URL="$(echo "$RESPONSE" | jq -r '.latest_upload_url')"

          test -n "$VERSION_UPLOAD_URL" && [ "$VERSION_UPLOAD_URL" != "null" ] || {
            echo "version_upload_url missing in response: $RESPONSE"
            exit 1
          }

          test -n "$LATEST_UPLOAD_URL" && [ "$LATEST_UPLOAD_URL" != "null" ] || {
            echo "latest_upload_url missing in response: $RESPONSE"
            exit 1
          }

          for URL in "$VERSION_UPLOAD_URL" "$LATEST_UPLOAD_URL"; do
            success=false
            for attempt in {1..5}; do
              echo "Uploading ${FILE} (Attempt $attempt) ..."
              if curl -sS --fail -X PUT "$URL" \
                -H "Content-Type: application/octet-stream" \
                -H "x-amz-meta-version: ${REF}" \
                -H "x-amz-checksum-crc32: ${CHECKSUM}" \
                -H "x-amz-sdk-checksum-algorithm: CRC32" \
                --upload-file "$FILE"; then
                success=true
                break
              else
                echo "Upload failed on attempt $attempt. Retrying in 2 seconds..."
                sleep 2
              fi
            done
            if [ "$success" = "false" ]; then
              echo "Error: Failed to upload ${FILE} after 5 attempts."
              exit 1
            fi
          done

  post-summary:
    name: Post Summary
    runs-on: ubuntu-latest
    if: inputs.post_summary
    needs: [github, propagator]
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          fetch-tags: true

      - name: Get tag
        id: tag
        run: |
          echo ::set-output name=tag::$(git tag --sort=-creatordate | sed -n '1p')

      - name: Get previous tag
        id: previous-tag
        run: |
          echo ::set-output name=tag::$(git tag --sort=-creatordate | sed -n '2p')

      - name: Get release info
        id: release-info
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          token: ${{ github.token }}
          excludes: draft
          repository: ${{ github.repository }}

      - name: Download streamer
        env:
          CEDANA_AUTH_TOKEN: ${{ secrets.CEDANA_AUTH_TOKEN }}
          VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          BUILD="alpha"
          if [ "${VERSION#v}" != "$VERSION" ] || [ "$VERSION" = "latest" ]; then
            BUILD=""
          fi
          ARCH="${{ matrix.arch }}"
          FILE="cedana-image-streamer"

          mkdir -p current

          curl -fL \
            "${CEDANA_URL}/plugins/download/${FILE}?version=${VERSION}&arch=${ARCH}&build=${BUILD}" \
            -H "Authorization: Bearer $CEDANA_AUTH_TOKEN" \
            --output "current/${FILE}"

          test -f "current/${FILE}"
          test -s "current/${FILE}"

      - name: Download previous streamer
        env:
          CEDANA_AUTH_TOKEN: ${{ secrets.CEDANA_AUTH_TOKEN }}
          VERSION: ${{ steps.previous-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "No previous version tag found. Skipping download of previous binaries."
            exit 0
          fi
          BUILD="alpha"
          if [ "${VERSION#v}" != "$VERSION" ] || [ "$VERSION" = "latest" ]; then
            BUILD=""
          fi
          ARCH="${{ matrix.arch }}"
          FILE="cedana-image-streamer"

          mkdir -p previous

          if curl -fL \
            "${CEDANA_URL}/plugins/download/${FILE}?version=${VERSION}&arch=${ARCH}&build=${BUILD}" \
            -H "Authorization: Bearer $CEDANA_AUTH_TOKEN" \
            --output "previous/${FILE}" && \
            test -f "previous/${FILE}" && \
            test -s "previous/${FILE}"; then
            echo "Downloaded previous ${FILE} successfully."
          else
            echo "Failed to download previous ${FILE}, ignoring."
            rm -f "previous/${FILE}"
          fi

      - name: Generate summary
        id: summary
        env:
          RELEASE_TITLE: "cedana-image-streamer"
          RELEASE_DESCRIPTION: "**${{ steps.tag.outputs.tag }}**"
          RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/releases/${{ steps.tag.outputs.tag }}
          RELEASE_BODY: "${{ steps.release-info.outputs.description }}"
          TAG: ${{ steps.tag.outputs.tag }}
          BINARIES_DIR: current
          PREVIOUS_TAG: ${{ steps.previous-tag.outputs.tag }}
          PREVIOUS_BINARIES_DIR: previous
        run: |
          echo $RELEASE_BODY > $GITHUB_STEP_SUMMARY
          echo ::set-output name=slack-summary::$(scripts/ci/release-summary-slack)

      - name: Post summary
        id: slack-patch
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_RELEASE }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            ${{ steps.summary.outputs.slack-summary }}
