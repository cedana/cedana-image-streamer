name: Push

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      debug_build:
        type: boolean
        description: "Run build with debugging enabled"
        required: false
        default: false
      debug_test:
        type: boolean
        description: "Run tests with debugging enabled"
        required: false
        default: false
      debug_publish:
        type: boolean
        description: "Run publish with debugging enabled"
        required: false
        default: false

concurrency:
  group: cedana-image-streamer-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A tagged commit is a release: the release workflow runs instead of this one.
  check_release:
    name: Check release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tags.outputs.release }}
    steps:
      - name: Check if commit is tagged
        id: tags
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --tags "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" | grep -q "^$GITHUB_SHA"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: check_release
    if: needs.check_release.outputs.release != 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_build }}

  download:
    name: Download
    needs: check_release
    if: needs.check_release.outputs.release != 'true'
    uses: cedana/cedana/.github/workflows/download.yml@main
    secrets: inherit
    with:
      cedana_version: main
      criu_version: criu-dev
      gpu_version: main

  test:
    name: Test
    uses: cedana/cedana/.github/workflows/test_streamer.yml@main
    needs: [build, download]
    secrets: inherit
    with:
      ref: main
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_test }}

  test_unit:
    name: Test (Unit)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v2
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - run: make test

  publish:
    name: Publish
    uses: ./.github/workflows/publish.yml
    needs: build
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_publish }}
      propagator: true
      propagator_repo: cedana-image-streamer-alpha
      post_summary: false
